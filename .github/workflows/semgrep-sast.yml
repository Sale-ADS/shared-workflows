name: Semgrep SAST

# SAST bloqueante org-wide con Semgrep OSS (gratis, sin token del SaaS).
# Cierra F2-04 (Snyk solo en 1 repo / sin SAST real).
# Mismo patrón que trivy-security.yml: enforce=false => warn-only (rollout gradual, canario primero).
#
# RESULTADOS (free-tier, repos privados sin GHAS):
#  - Job Summary (markdown) con el conteo de findings.
#  - Artifact 'semgrep-sarif' descargable (visor SARIF o ingesta al SKRIT Dashboard).
#  - upload-sarif al Security tab es OPT-IN (default false): en repos PRIVADOS requiere
#    GitHub Advanced Security (pago, hoy apagado). Activar solo en repos PUBLICOS o con GHAS.

on:
  workflow_call:
    inputs:
      config:
        description: 'Semgrep rulesets (space separated registry packs, gratis).'
        required: false
        type: string
        default: 'p/default p/security-audit p/secrets p/owasp-top-ten'
      enforce:
        description: 'Block the pipeline on findings (exit-code 1). false = warn-only.'
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: 'Subir SARIF al Security tab. Solo repos PUBLICOS o con GHAS (pago). Default false.'
        required: false
        type: boolean
        default: false

# NOTE: Do NOT add a permissions block here.
# Callers con upload-sarif=true deben declarar: permissions: { contents: read, security-events: write }

jobs:
  semgrep:
    name: SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        # Un solo scan: escribe el SARIF y, si enforce=true, agrega --error para fallar el step
        # (el gate). Semgrep escribe el archivo ANTES de salir, asi que los pasos always() lo ven.
        run: |
          CONFIG_FLAGS=""
          for pack in ${{ inputs.config }}; do
            CONFIG_FLAGS="$CONFIG_FLAGS --config $pack"
          done
          semgrep scan $CONFIG_FLAGS --sarif --output semgrep.sarif ${{ inputs.enforce && '--error' || '' }}

      - name: Resumen en Job Summary
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            COUNT=$(python3 -c "import json;d=json.load(open('semgrep.sarif'));print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo '?')
            {
              echo "## 🧪 Semgrep SAST"
              echo ""
              echo "**Findings:** ${COUNT}"
              echo "**Modo:** ${{ inputs.enforce && 'ENFORCE (bloqueante)' || 'WARN (no bloquea)' }}"
              echo ""
              echo "Descargá el artifact \`semgrep-sarif\` para el detalle completo."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Semgrep no produjo SARIF (revisar logs del step Run Semgrep)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar SARIF como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Subir SARIF al Security tab (opt-in · repos publicos / GHAS)
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
