name: Snyk Security Scan

on:
  workflow_call:
    inputs:
      language:
        description: 'Project language: java or node'
        required: true
        type: string
      java-version:
        description: 'Java version (only for language=java)'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution (only for language=java)'
        required: false
        type: string
        default: 'corretto'
      node-version:
        description: 'Node.js version (only for language=node)'
        required: false
        type: string
        default: '20'
      snyk-org:
        description: 'Snyk organization slug'
        required: false
        type: string
        default: 'sa-backdev'
      severity-threshold:
        description: 'Minimum severity to report: low|medium|high|critical'
        required: false
        type: string
        default: 'high'
      scan-open-source:
        description: 'Run Snyk Open Source (dependency) scan'
        required: false
        type: boolean
        default: true
      scan-code:
        description: 'Run Snyk Code (SAST) scan'
        required: false
        type: boolean
        default: true
      scan-container:
        description: 'Run Snyk Container scan'
        required: false
        type: boolean
        default: true
      scan-iac:
        description: 'Run Snyk IaC scan'
        required: false
        type: boolean
        default: false
      docker-image-name:
        description: 'Docker image name for container scanning'
        required: false
        type: string
        default: ''
      dockerfile-path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
    secrets:
      snyk-token:
        description: 'Snyk API token'
        required: false

# NOTE: permissions are set by caller workflows, not here.
# Callers must declare: permissions: { contents: read, security-events: write, actions: read }

jobs:
  # ============================================================
  # JOB 1: Snyk Open Source (Dependency Vulnerability Scanning)
  # ============================================================
  snyk-open-source:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    if: ${{ inputs.scan-open-source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Setup Node.js
        if: ${{ inputs.language == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install Node.js dependencies
        if: ${{ inputs.language == 'node' }}
        run: npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        run: |
          snyk test \
            --severity-threshold=${{ inputs.severity-threshold }} \
            --org=${{ inputs.snyk-org }} \
            --sarif-file-output=snyk-opensource.sarif

      - name: Upload Snyk Open Source SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-opensource.sarif
          category: snyk-open-source
        continue-on-error: true

  # ============================================================
  # JOB 2: Snyk Code (SAST)
  # ============================================================
  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    if: ${{ inputs.scan-code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Code scan
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        run: |
          snyk code test \
            --org=${{ inputs.snyk-org }} \
            --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
        continue-on-error: true

  # ============================================================
  # JOB 3: Snyk Container (Docker Image Scanning)
  # ============================================================
  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    if: ${{ inputs.scan-container && inputs.docker-image-name != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Build Java artifact
        if: ${{ inputs.language == 'java' }}
        run: ./mvnw package -DskipTests -q

      - name: Setup Node.js
        if: ${{ inputs.language == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install Node.js dependencies
        if: ${{ inputs.language == 'node' }}
        run: npm ci

      - name: Build Docker image for scanning
        run: |
          docker build \
            -t ${{ inputs.docker-image-name }}:snyk-scan \
            -f ${{ inputs.dockerfile-path }} \
            .

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Container scan
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        run: |
          snyk container test \
            ${{ inputs.docker-image-name }}:snyk-scan \
            --severity-threshold=${{ inputs.severity-threshold }} \
            --org=${{ inputs.snyk-org }} \
            --file=${{ inputs.dockerfile-path }} \
            --exclude-app-vulns \
            --sarif-file-output=snyk-container.sarif

      - name: Upload Snyk Container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
        continue-on-error: true

  # ============================================================
  # JOB 4: Snyk IaC (Infrastructure as Code)
  # ============================================================
  snyk-iac:
    name: Snyk IaC
    runs-on: ubuntu-latest
    if: ${{ inputs.scan-iac }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk IaC scan
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        run: |
          snyk iac test \
            --severity-threshold=${{ inputs.severity-threshold }} \
            --org=${{ inputs.snyk-org }} \
            --sarif-file-output=snyk-iac.sarif

      - name: Upload Snyk IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac
        continue-on-error: true
